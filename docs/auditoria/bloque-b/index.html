<!doctype html><html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rediseño Teckware</title>
<style>
:root{color-scheme:dark;--bg:#060B19;--fg:#F1F5F9;--muted:#A3AEC2;--line:#22304A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.5 system-ui,sans-serif;padding:32px max(16px,4vw) 64px}
main{max-width:1180px;margin:auto;display:grid;gap:48px}h1{font-size:clamp(2rem,4vw,3rem);margin:0 0 8px}h2{margin:0 0 12px;font-size:1.5rem}p{margin:0;color:var(--muted);max-width:62ch}
.fila{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px;align-items:start;padding-top:20px;border-top:1px solid var(--line)}figure{margin:0;min-width:0}figcaption{font-size:14px;color:var(--muted);margin-bottom:6px}img{display:block;width:100%;height:auto;border:1px solid var(--line)}
@media(max-width:700px){.fila{grid-template-columns:minmax(0,1fr)}.m{max-width:240px}}
</style></head><body><main>
<header><h1>Rediseño aplicado: Corte hexagonal</h1><p>Capturas del sitio real en local, en la rama feat/cierre-pro. Aún no está publicado. PC Gamer conserva su contenido porque se rehace en el Bloque C.</p></header>
<section class="fila"><figure><figcaption>Inicio, escritorio</figcaption><img src="esc-home.jpg" alt="Inicio en escritorio"></figure><figure class="m"><figcaption>Inicio, celular</figcaption><img src="mov-home.jpg" alt="Inicio en celular"></figure></section>
<section class="fila"><figure><figcaption>Servicios, escritorio</figcaption><img src="esc-servicios.jpg" alt="Servicios en escritorio" loading="lazy"></figure><figure class="m"><figcaption>Servicios, celular</figcaption><img src="mov-servicios.jpg" alt="Servicios en celular" loading="lazy"></figure></section>
<section class="fila"><figure><figcaption>Landing de mantención, escritorio</figcaption><img src="esc-mantencion-pc-gamer.jpg" alt="Landing en escritorio" loading="lazy"></figure><figure class="m"><figcaption>Landing, celular</figcaption><img src="mov-mantencion-pc-gamer.jpg" alt="Landing en celular" loading="lazy"></figure></section>
<section class="fila"><figure><figcaption>Agendar, escritorio</figcaption><img src="esc-agendar.jpg" alt="Agendar en escritorio" loading="lazy"></figure><figure class="m"><figcaption>Agendar, celular</figcaption><img src="mov-agendar.jpg" alt="Agendar en celular" loading="lazy"></figure></section>
<section class="fila"><figure><figcaption>Contacto, escritorio</figcaption><img src="esc-contacto.jpg" alt="Contacto en escritorio" loading="lazy"></figure><figure class="m"><figcaption>Contacto, celular</figcaption><img src="mov-contacto.jpg" alt="Contacto en celular" loading="lazy"></figure></section>
</main></body></html>
